# dsh-remote-access —— 插入一行 Host 插件。
#
# 这里只写「部署默认值」；其余参数默认值由插件的 Config 声明提供，
# 在 DSH 插件页里点这一行的「配置」就能改（保存会写进 profile 的 patch 层）。
- insert:
    - id: remote-access
      name: '@local/dsh-remote-access'
      config:
        enabled: true
        # 允许来访的网段（唯一的安全边界）；listen=auto 时也用它挑选本机要监听的地址
        allowCidrs:
          - 100.64.0.0/10
        # DSH 界面端口；本机实测 127.0.0.1:19387。换端口就改这里，或改成 auto 自动探测
        upstream: http://127.0.0.1:19387
